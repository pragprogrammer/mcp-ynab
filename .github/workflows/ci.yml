name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Locked environment. Catches code regressions.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run pytest
        env:
          YNAB_API_KEY: test-dummy-key

  # Fresh resolution from pyproject constraints, no lockfile. Catches the world
  # moving underneath us, which is what the locked job structurally cannot see.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/smoke_test.py
