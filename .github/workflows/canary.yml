name: Dependency canary

# Resolves from the declared constraints against live PyPI on a schedule, so an
# upstream major release surfaces here within a week instead of in a user's install.
# mcp 2.0.0 landed 2026-07-28 and was reported by a user on 07-31; this job is what
# should have caught it first.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # highest: what a user installing today gets.
        # lowest-direct: proves the floors we declare are actually installable.
        resolution: [highest, lowest-direct]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/smoke_test.py --resolution ${{ matrix.resolution }}

  report:
    needs: resolve
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Dependency canary failed';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled dependency canary failed, which means a fresh resolution',
              'from the constraints in `pyproject.toml` no longer produces a working',
              'install. This usually means an upstream release broke us.',
              '',
              `Run: ${url}`,
              '',
              'Check which leg failed. `highest` means a new upstream version broke us',
              'and users installing today are affected. `lowest-direct` means a declared',
              'floor is no longer installable.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const open = existing.data.find(i => i.title === title && !i.pull_request);

            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
