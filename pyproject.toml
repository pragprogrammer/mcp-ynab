[project]
name = "mcp-ynab"
version = "1.1.0"
description = "MCP server that connects AI assistants to your YNAB budget"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
authors = [{ name = "Michael Green" }]
keywords = ["ynab", "mcp", "budget", "ai", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    # Upper bounds are deliberate: an unbounded mcp[cli]>=1.26.0 broke every fresh
    # install when the SDK shipped 2.0.0 and removed mcp.server.fastmcp (see #21).
    # aiosqlite is intentionally left unbounded; it is never imported directly and
    # SQLAlchemy constrains it. Lifting a cap needs a canary/smoke run, not a guess.
    "httpx>=0.28.1,<1.0",
    "mcp[cli]>=2.0.0,<3.0.0",
    # Floor tracks mcp 2.x, which itself requires pydantic>=2.12.0.
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.9.1,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.41,<3.0.0",
    "aiosqlite>=0.21.0",
]

[project.scripts]
mcp-ynab = "src.server:main"

[project.urls]
Homepage = "https://github.com/pragprogrammer/mcp-ynab"
Repository = "https://github.com/pragprogrammer/mcp-ynab"
Issues = "https://github.com/pragprogrammer/mcp-ynab/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
]

[tool.hatch.build.targets.wheel]
# TODO: this installs a top-level `src` package into site-packages, which collides
# with any other distribution doing the same. Rename to `mcp_ynab` (breaking import
# change, needs its own major/minor release, not a fix release).
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
